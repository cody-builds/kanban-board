name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /kanban-board
          NEXT_PUBLIC_BUILD_VERSION: ${{ github.run_id }}-${{ github.run_number }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GITHUB_SHA: ${{ github.sha }}
      
      - name: Verify build output
        run: |
          echo "📦 Build output:"
          ls -la out/
          echo ""
          echo "📋 version.json:"
          cat out/version.json
          echo ""
          echo "🔍 Checking Supabase config in bundle..."
          if grep -q "supabase" out/_next/static/chunks/*.js 2>/dev/null; then
            echo "✅ Supabase references found in bundle"
          else
            echo "⚠️ No Supabase references - check if secrets are configured"
          fi
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
